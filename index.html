<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8 Ball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .ball {
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            background: radial-gradient(circle at 30% 30%, #2d2d2d, #000000);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        .ball::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 40px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
            border-radius: 50%;
        }
        
        .window {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #1e3a8a, #4338ca);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .fortune {
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }
            
            .ball {
                width: 240px;
                height: 240px;
            }
            
            .window {
                width: 120px;
                height: 120px;
            }
            
            .fortune {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 Magic 8 Ball 🎱</h1>
        <div class="ball">
            <div class="window">
                <div class="fortune" id="fortune"></div>
            </div>
        </div>
        <!-- <button onclick="getNewFortune()">Ask Again</button> -->
    </div>

    <script>
        const fortunes = [
            "It is certain",
            "Without a doubt",
            "You may rely on it",
            "Yes definitely",
            "It is decidedly so",
            "As I see it, yes",
            "Most likely",
            "Yes",
            "Signs point to yes",
            "Outlook good",
            "Better not tell you now",
            "Ask again later",
            "Cannot predict now",
            "Concentrate and ask again",
            "Don't count on it",
            "Outlook not so good",
            "My sources say no",
            "Very doubtful",
            "My reply is no",
            "Boo. 👻",
            "🫵😸",
            "six seven"
        ];

        function getRandomFortune() {
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            return fortunes[randomIndex];
        }

        function displayFortune() {
            const fortuneEl = document.getElementById('fortune');
            fortuneEl.style.animation = 'none';
            setTimeout(() => {
                fortuneEl.textContent = getRandomFortune();
                fortuneEl.style.animation = 'fadeIn 0.5s ease-in';
            }, 10);
        }

        function getNewFortune() {
            displayFortune();
        }

        // Display fortune on page load
        displayFortune();
    </script>
</body>
</html>
